name: Release

# Production release. Triggered by pushing a tag like v1.2.3 (or run manually with a version).
# Builds the SIGNED release APK + AAB and publishes them to a GitHub Release.
#
# Required repo secrets (set once — see the app README / release notes):
#   RELEASE_KEYSTORE_BASE64   base64 of your release keystore (.jks)
#   RELEASE_STORE_PASSWORD    keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password
#   SUPABASE_URL / SUPABASE_ANON_KEY   (optional) bake login into the release
#   POSTHOG_CLI_API_KEY  personal key with Error Tracking write + organization read
#
# Play Store upload AAB (playstore flavor) signs with a SEPARATE dedicated key —
# the GitHub-release key must never change (the in-app updater needs signature
# continuity), while the Play upload key is rotatable via Play App Signing:
#   PLAY_UPLOAD_KEYSTORE_BASE64 / PLAY_UPLOAD_STORE_PASSWORD
#   PLAY_UPLOAD_KEY_ALIAS / PLAY_UPLOAD_KEY_PASSWORD
#
# The playstore AAB is then published to Google Play automatically via the Play
# Developer API (service account json in PLAY_SERVICE_ACCOUNT_JSON). A tag push
# publishes to `internal`; pick another track on a manual run to promote further.
# Production uploads stay blocked by Google until the closed-test requirement is
# met and production access is granted — the pipeline is ready for that day.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3 (creates tag v<version>)'
        required: true
      draft:
        description: 'Create the GitHub Release as a DRAFT (not published)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      play_track:
        description: 'Google Play track to publish the AAB to'
        required: true
        default: alpha
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      POSTHOG_CLI_HOST: https://us.posthog.com
      POSTHOG_CLI_PROJECT_ID: '494529'
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            V="${GITHUB_REF_NAME#v}"
            DRAFT="false"
          fi
          BASE_VERSION_CODE=$(awk -F= '$1 == "CURRENT_PROJECT_VERSION" { gsub(/[[:space:]]/, "", $2); print $2; exit }' iosApp/Configuration/Version.xcconfig)
          case "$BASE_VERSION_CODE" in
            ''|*[!0-9]*) echo "Invalid CURRENT_PROJECT_VERSION: $BASE_VERSION_CODE" >&2; exit 1 ;;
          esac
          VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle (deps + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install PostHog symbol uploader
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::warning::POSTHOG_CLI_API_KEY is not set - skipping symbol upload tooling"
            exit 0
          fi
          npm install --global @posthog/cli@0.10.0

      - name: Validate release credentials
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          missing=()
          for key in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"

      - name: Configure local.properties
        run: |
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "SUPABASE_FALLBACK_URL=${{ secrets.SUPABASE_FALLBACK_URL }}"
            echo "NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}"
            echo "NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}"
            echo "NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}"
            echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}"
            echo "TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}"
            echo "TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}"
            echo "TRAKT_REDIRECT_URI=nuvio://auth/trakt"
            echo "SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}"
            echo "SIMKL_CLIENT_SECRET=${{ secrets.SIMKL_CLIENT_SECRET }}"
            echo "DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}"
          } >> local.properties

      - name: Verify local.properties keys reached the build
        run: |
          # Names only - never values. Proves whether the credential lines are present
          # at the moment Gradle reads the file, which a masked echo cannot.
          echo "keys in local.properties:"
          sed -n 's/^\([A-Za-z0-9_]*\)=.*/  \1/p' local.properties | sort
          for k in TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET NUVIO_RELEASE_KEY_ALIAS; do
            v=$(sed -n "s/^$k=//p" local.properties | head -1)
            echo "  $k length=${#v}"
            test -n "$v" || { echo "::error::$k is empty"; exit 1; }
          done

      - name: Raise Gradle heap
        run: printf '\norg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\n' >> gradle.properties

      - name: Build signed draft APK (arm64-v8a only)
        if: steps.ver.outputs.draft == 'true'
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleFullRelease \
            -x :androidApp:uploadPostHogProguardMappingsFullRelease \
            -PversionNameOverride="${{ steps.ver.outputs.version }}" \
            -PversionCodeOverride="${{ steps.ver.outputs.version_code }}" --stacktrace

      - name: Build signed production APK + AAB
        if: steps.ver.outputs.draft != 'true'
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleFullRelease :androidApp:bundleFullRelease \
            -PversionNameOverride="${{ steps.ver.outputs.version }}" \
            -PversionCodeOverride="${{ steps.ver.outputs.version_code }}" --stacktrace

      - name: Decode Play upload keystore
        if: steps.ver.outputs.draft != 'true'
        run: echo "${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/play-upload.jks"

      - name: Build Play Store AAB (playstore flavor, dedicated upload key)
        if: steps.ver.outputs.draft != 'true'
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ github.workspace }}/play-upload.jks
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundlePlaystoreRelease \
            -PversionNameOverride="${{ steps.ver.outputs.version }}" \
            -PversionCodeOverride="${{ steps.ver.outputs.version_code }}" --stacktrace

      - name: Verify draft APK
        if: steps.ver.outputs.draft == 'true'
        env:
          EXPECTED_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: |
          APK=$(find androidApp/build -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$APK" || { echo "No arm64-v8a APK was produced" >&2; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$APKSIGNER" || { echo "apksigner is missing" >&2; exit 1; }
          test -x "$AAPT2" || { echo "aapt2 is missing" >&2; exit 1; }
          test -x "$ZIPALIGN" || { echo "zipalign is missing" >&2; exit 1; }
          SIGNATURE_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNATURE_INFO"
          case "$SIGNATURE_INFO" in
            *"Signer #1 certificate SHA-256 digest: ba6b5e475b46407a0c0938a3d1c7dea8f601a86fd43b4a760e2672920eb23e0d"*) ;;
            *) echo "APK was signed by the wrong certificate" >&2; exit 1 ;;
          esac
          "$ZIPALIGN" -c 4 "$APK"
          BADGING=$("$AAPT2" dump badging "$APK")
          case "$BADGING" in
            *"package: name='com.tuvora.mobile'"*) ;;
            *) echo "Unexpected package in APK" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"testOnly"*) echo "APK is test-only and cannot be installed" >&2; exit 1 ;;
          esac
          case "$BADGING" in
            *"versionCode='$EXPECTED_VERSION_CODE'"*"versionName='$EXPECTED_VERSION_NAME'"*) ;;
            *) echo "Unexpected APK version" >&2; exit 1 ;;
          esac
          NATIVE_CODE=$(printf '%s\n' "$BADGING" | sed -n '/^native-code:/p')
          test "$NATIVE_CODE" = "native-code: 'arm64-v8a'" || {
            echo "APK is not arm64-v8a-only: $NATIVE_CODE" >&2
            exit 1
          }
          APK_ENTRIES=$(unzip -Z1 "$APK")
          for library in libmpv.so libavcodec.so libavformat.so libnuvio_engine.so libquickjs.so; do
            case "$APK_ENTRIES" in
              *"lib/arm64-v8a/$library"*) ;;
              *) echo "APK is missing required native library: $library" >&2; exit 1 ;;
            esac
          done
          echo "DRAFT_APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          if [ "${{ steps.ver.outputs.draft }}" = "true" ]; then
            APK="${DRAFT_APK_PATH:-}"
            if [ -z "$APK" ]; then
              APK=$(find androidApp/build/outputs -type f -name '*.apk' -print -quit)
            fi
            test -n "$APK" || { echo "No arm64-v8a APK was produced" >&2; exit 1; }
            cp "$APK" "dist/NuvioX-${{ steps.ver.outputs.version }}-arm64-v8a.apk"
          else
            cp "$(find androidApp/build/outputs -type f -name '*.apk' -print -quit)" "dist/NuvioX-${{ steps.ver.outputs.version }}.apk"
            cp "$(find androidApp/build/outputs/bundle/fullRelease -name '*.aab' | head -1)" "dist/NuvioX-${{ steps.ver.outputs.version }}.aab"
            cp "$(find androidApp/build/outputs/bundle/playstoreRelease -name '*.aab' | head -1)" "dist/NuvioX-${{ steps.ver.outputs.version }}-playstore.aab"
          fi
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            "${{ steps.ver.outputs.tag }}"
            --target "${GITHUB_SHA}"
            --title "Nuvio X ${{ steps.ver.outputs.version }}"
            --generate-notes
          )
          if [ "${{ steps.ver.outputs.draft }}" = "true" ]; then
            release_args+=(--draft)
          fi
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.ver.outputs.tag }}" dist/* --clobber
            gh release edit "${{ steps.ver.outputs.tag }}" \
              --target "${GITHUB_SHA}" \
              --title "Nuvio X ${{ steps.ver.outputs.version }}"
          else
            gh release create "${release_args[@]}" dist/*
          fi

      # Play publishing runs LAST on purpose. It used to sit before the GitHub release,
      # so a Play rejection (a re-run reuses github.run_number, and Play refuses a
      # duplicate version code) skipped the release upload entirely and the artifacts
      # were silently never replaced. Artifacts first; Play failures still fail the job.
      - name: Publish AAB to Google Play
        if: steps.ver.outputs.draft != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tuvora.mobile
          releaseFiles: androidApp/build/outputs/bundle/playstoreRelease/*.aab
          # Tag push -> internal AND alpha, in one edit.
          #
          # alpha is what the production-access gate measures (12 testers, 14 continuous days),
          # so it must never go stale. But alpha needs Google review, which means a release can
          # sit for hours before any tester sees it — internal testing publishes with no review
          # at all, so the team gets the build in minutes. Publishing to internal used to be
          # skipped entirely and it drifted a week behind (1.4.25 while alpha was on 1.4.35).
          #
          # `tracks` (plural) assigns the SAME uploaded bundle to both tracks inside one edit.
          # Do NOT do this as two invocations of the action: the second upload re-sends the same
          # version code and Play rejects it outright.
          tracks: ${{ github.event.inputs.play_track || 'internal,alpha' }}
          status: completed

      # The download links people actually use — tuvora.co/apk, and the aftv.news Downloader code
      # pointing at it — are not a lookup. The site serves whatever a release last told it, so tell
      # it now. This is the step that makes a released build reachable; if it fails the release is
      # published but the short URL still serves the previous build, so it fails the job loudly.
      - name: Publish the download pointer to tuvora.co
        if: steps.ver.outputs.draft != 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.TUVORA_RELEASE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::TUVORA_RELEASE_TOKEN is not set — tuvora.co/apk will keep serving the previous build"
            exit 0
          fi
          ASSET="NuvioX-${VERSION}.apk"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          curl -fsS -X POST "https://tuvora.co/api/releases" \
            -H "authorization: Bearer $RELEASE_TOKEN" \
            -H "content-type: application/json" \
            -d "$(jq -n --arg p "mobile" --arg t "$TAG" --arg u "$URL" --arg n "$ASSET" \
                  '{platform:$p, tag:$t, asset_url:$u, asset_name:$n}')"
          echo

          # One request, no retry loop: the pointer is stored, not cached, so it is either right now
          # or something is wrong.
          TARGET=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 20 "https://tuvora.co/apk")
          echo "https://tuvora.co/apk -> $TARGET"
          case "$TARGET" in
            *"/download/${TAG}/"*) echo "✅ tuvora.co/apk serves ${TAG}" ;;
            *) echo "::error::tuvora.co/apk serves '$TARGET', not ${TAG}"; exit 1 ;;
          esac

      # Community announcements — no-ops until the DISCORD_/TELEGRAM_ secrets exist.
      # Never fails the release (all curl errors are swallowed).
      - name: Announce release (Discord + Telegram)
        if: steps.ver.outputs.draft != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          MSG=$(printf '%s\n' \
            "Nuvio X ${VERSION} is out! 🎉" \
            "" \
            "⬇️ APK: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            "🏪 Play beta: join https://groups.google.com/g/tuvora-testers then https://play.google.com/apps/testing/com.tuvora.mobile" \
            "📖 Guides: https://tuvora.co/guides")
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            jq -n --arg c "$MSG" '{content: $c}' | \
              curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" \
              || echo "::warning::Discord announce failed"
          else
            echo "DISCORD_WEBHOOK_URL not set - skipping Discord announce"
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="$MSG" >/dev/null \
              || echo "::warning::Telegram announce failed"
          else
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set - skipping Telegram announce"
          fi
