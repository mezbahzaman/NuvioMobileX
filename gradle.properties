#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmArgs=-Xmx16384M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
# 8G, not 12G: this machine has 24G, and a second daemon spawns whenever a build
# overlaps another (Xcode archive + CLI build), which at 12G each exhausted swap.
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
