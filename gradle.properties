#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmArgs=-Xmx16384M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
# 12G is what the Release/arm64 archive needs — its whole-program Kotlin/Native pass OOMs at 8G,
# even though Android and simulator builds never climb past ~4G. Don't lower this without running
# a full `xcodebuild archive`; a debug build proves nothing here. Overlapping builds spawn a
# second daemon and can exhaust a 24G machine, so run one build at a time instead.
org.gradle.jvmargs=-Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
